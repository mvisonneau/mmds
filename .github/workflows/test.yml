---
name: test

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches:
      - main

jobs:
  test:
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - macos-11.0
          - windows-2022

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: 1.23

      - name: Lint
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        run: make lint

      - name: Test
        run: make test

      - name: Publish coverage to coveralls.io
        uses: shogo82148/actions-goveralls@785c9d68212c91196d3994652647f8721918ba11 # v1
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        with:
          path-to-profile: coverage.out

      - name: Build
        run: make build
